<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a2233">Empfohlen: Taptic Engine über DRV2605L am ESP32-C6-LCD-1.47</text>

  <g stroke="#1a2233" stroke-width="2.2" fill="none" stroke-linecap="round">
    <!-- Board -->
    <rect x="30" y="70" width="200" height="440" rx="10" fill="#eef3fb"/>
    <!-- DRV2605L-Breakout -->
    <rect x="440" y="110" width="200" height="370" rx="10" fill="#f3eefb"/>

    <!-- 3V3 -> VIN -->
    <line x1="230" y1="140" x2="440" y2="140" stroke="#c0392b"/>
    <!-- GND -->
    <line x1="230" y1="440" x2="440" y2="440"/>
    <!-- SDA / SCL / IN -->
    <line x1="230" y1="220" x2="440" y2="220" stroke="#2a6fb0"/>
    <line x1="230" y1="290" x2="440" y2="290" stroke="#2a8a50"/>
    <line x1="230" y1="360" x2="440" y2="360" stroke="#8a8f9c" stroke-dasharray="7 6"/>

    <!-- Puffer-Elko an VIN -->
    <line x1="340" y1="140" x2="340" y2="170"/>
    <line x1="324" y1="170" x2="356" y2="170"/>
    <path d="M324,185 Q340,176 356,185"/>
    <line x1="340" y1="181" x2="340" y2="200"/>
    <line x1="340" y1="200" x2="360" y2="200"/>
    

    <!-- OUT+ / OUT- zur Spule -->
    <line x1="640" y1="230" x2="800" y2="230"/>
    <line x1="800" y1="230" x2="800" y2="250"/>
    <path d="M800,250 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20"/>
    <line x1="800" y1="330" x2="800" y2="350"/>
    <line x1="640" y1="350" x2="800" y2="350"/>
  </g>

  <!-- Masse-Symbol fuer C2 -->
  <g stroke="#1a2233" stroke-width="2.2">
    <line x1="360" y1="200" x2="360" y2="210"/>
    <line x1="348" y1="210" x2="372" y2="210"/>
    <line x1="353" y1="215" x2="367" y2="215"/>
    <line x1="358" y1="220" x2="362" y2="220"/>
  </g>

  <g fill="#1a2233">
    <circle cx="230" cy="140" r="5" fill="#c0392b"/>
    <circle cx="230" cy="220" r="5" fill="#2a6fb0"/>
    <circle cx="230" cy="290" r="5" fill="#2a8a50"/>
    <circle cx="230" cy="360" r="5" fill="#8a8f9c"/>
    <circle cx="230" cy="440" r="5"/>
    <circle cx="340" cy="140" r="4.5" fill="#c0392b"/>
    <circle cx="440" cy="140" r="5" fill="#c0392b"/>
    <circle cx="440" cy="220" r="5" fill="#2a6fb0"/>
    <circle cx="440" cy="290" r="5" fill="#2a8a50"/>
    <circle cx="440" cy="360" r="5" fill="#8a8f9c"/>
    <circle cx="440" cy="440" r="5"/>
    <circle cx="640" cy="230" r="5"/>
    <circle cx="640" cy="350" r="5"/>
  </g>

  <!-- Board-Beschriftung -->
  <text x="130" y="470" text-anchor="middle" font-weight="bold" fill="#1a2233">Waveshare</text>
  <text x="130" y="490" text-anchor="middle" font-weight="bold" fill="#1a2233">ESP32-C6-LCD-1.47</text>
  <text x="220" y="145" text-anchor="end" fill="#c0392b" font-weight="bold">3V3</text>
  <text x="220" y="225" text-anchor="end" fill="#2a6fb0" font-weight="bold">GPIO 18</text>
  <text x="220" y="295" text-anchor="end" fill="#2a8a50" font-weight="bold">GPIO 19</text>
  <text x="220" y="365" text-anchor="end" fill="#6a7080" font-weight="bold">GPIO 20</text>
  <text x="220" y="445" text-anchor="end" font-weight="bold" fill="#1a2233">GND</text>

  <!-- Leitungsbeschriftung -->
  <text x="250" y="132" fill="#c0392b" font-size="13">3,3 V (nicht 5 V!)</text>
  <text x="250" y="212" fill="#2a6fb0" font-size="13">I²C SDA</text>
  <text x="250" y="282" fill="#2a8a50" font-size="13">I²C SCL</text>
  <text x="250" y="352" fill="#6a7080" font-size="13">optional: Auslöser</text>
  <text x="250" y="432" fill="#1a2233" font-size="13">Masse</text>
  <text x="318" y="176" text-anchor="end" font-weight="bold" fill="#1a2233" font-size="13">C2 100 µF</text>
  <text x="318" y="192" text-anchor="end" fill="#55607a" font-size="12">optional, Elko</text>

  <!-- Breakout-Beschriftung -->
  <text x="540" y="290" text-anchor="middle" font-weight="bold" fill="#1a2233">DRV2605L</text>
  <text x="540" y="310" text-anchor="middle" fill="#55607a" font-size="13">Breakout</text>
  <text x="540" y="328" text-anchor="middle" fill="#55607a" font-size="13">I²C-Adresse 0x5A</text>
  <text x="452" y="145" font-size="14" font-weight="bold" fill="#c0392b">VIN</text>
  <text x="452" y="225" font-size="14" font-weight="bold" fill="#2a6fb0">SDA</text>
  <text x="452" y="295" font-size="14" font-weight="bold" fill="#2a8a50">SCL</text>
  <text x="452" y="365" font-size="14" font-weight="bold" fill="#6a7080">IN/TRIG</text>
  <text x="452" y="445" font-size="14" font-weight="bold" fill="#1a2233">GND</text>
  <text x="628" y="235" text-anchor="end" font-size="14" font-weight="bold" fill="#1a2233">OUT+</text>
  <text x="628" y="355" text-anchor="end" font-size="14" font-weight="bold" fill="#1a2233">OUT−</text>

  <text x="825" y="280" font-weight="bold" fill="#1a2233">Taptic</text>
  <text x="825" y="298" font-weight="bold" fill="#1a2233">Engine</text>
  <text x="825" y="316" font-size="13" fill="#55607a">LRA, 5–15 Ω</text>
  <text x="825" y="332" font-size="13" fill="#55607a">Polung egal</text>

  <!-- Hinweise -->
  <rect x="30" y="530" width="900" height="96" rx="8" fill="#fff8e6" stroke="#e0b84a"/>
  <text x="46" y="555" font-size="14" fill="#1a2233">• VIN an 3,3 V: Die I²C-Pullups des Breakouts hängen an VIN – an 5 V läge SDA/SCL über 3,3 V am ESP32.</text>
  <text x="46" y="577" font-size="14" fill="#1a2233">• Keine Diode, kein MOSFET nötig: Der DRV2605L hat die H-Brücke und den Schutz eingebaut.</text>
  <text x="46" y="599" font-size="14" fill="#1a2233">• GPIO 18/19/20 sind Vorschläge: freie Pins laut Platinenbeschriftung wählen, im Code anpassen.</text>
  <text x="46" y="619" font-size="14" fill="#1a2233">• IN/TRIG ist optional: ohne ihn wird jeder Klick per I²C-Befehl ausgelöst.</text>
</svg>
