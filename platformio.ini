; Flitz hüpft – Jump'n'Run für Waveshare ESP32-C6-LCD-1.47
[platformio]
default_envs = esp32c6_lcd147

[env:esp32c6_lcd147]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_upload.maximum_size = 1310720
board_build.partitions = default.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<haptik_test.cpp>
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.0
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0

; Haptik-Test: Taptic Engine über MOSFET an GPIO 2, ersetzt das Spiel
; pio run -e haptik_test -t upload
[env:haptik_test]
extends = env:esp32c6_lcd147
build_src_filter = -<*> +<haptik_test.cpp>
